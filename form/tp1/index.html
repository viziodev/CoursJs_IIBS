<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
    </head>

    <body>
        
        <main>
          <div class="container mt-5 ">
               <div class="card " style="width: 50%; margin-left: 25%;">
                <div class="card-header">Creation d'un Professeur</div>
                <div class="card-body">
                         <form action="" method="post" id="form-prof">
                            <div class="mb-1">
                                <label for="" class="form-label">Nom</label>
                                <input
                                    type="text"
                                    class="form-control form-control-sm "
                                    name=""
                                    id="nom"
                                    aria-describedby="nomError"
                                    placeholder=""
                                />
                                <small id="nomError" class="form-text"></small>
                            </div>
                            <div class="mb-1">
                                <label for="" class="form-label">Prenom</label>
                                <input
                                    type="text"
                                    class="form-control form-control-sm "
                                    name=""
                                    id="prenom"
                                    aria-describedby="prenomError"
                                    placeholder=""
                                />
                                <small id="prenomError" class="form-text ">Help text</small>
                            </div>
                           
                            <div class="mb-3">
                                <label for="" class="form-label">Grade</label>
                                <select
                                    class="form-select form-select-lg"
                                    name=""
                                    id="grade"
                                >
                                    <option value="" selected>--</option>
                                    <option value="Master">Master</option>
                                    <option value="Ingenieur">Ingenieur</option>
                                    <option value="Docteur">Docteur</option>
                                </select>
                                <small id="gradeError" class="form-text "></small>
                            </div>
                            <div> Matieres</div>
                            <small id="matieresError" class="form-text text-danger mt-1"></small>
                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id=""
                                    value="PHP"
                                />
                                <label class="form-check-label" for="">PHP</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id=""
                                    value="JS"
                                />
                                <label class="form-check-label" for="">JS</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id=""
                                    value="JAVA"
                                />
                                <label class="form-check-label" for="">JAVA</label>
                            </div>
                           
                            <div class="d-flex justify-content-end">
                                <button
                                    type="submit"
                                    class="btn btn-dark"
                                >
                                    Submit
                                </button>
                                
                            </div>
                            
                            
                         </form>
    
                </div>
               
               </div>
               
          </div>

        </main>
        
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
        <script type="module" src="script.js"></script>
    </body>
</html>
